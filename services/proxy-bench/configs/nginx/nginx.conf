worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format cache '$remote_addr - [$time_local] "$request" $status $upstream_cache_status';
    access_log /var/log/nginx/access.log cache;

    proxy_cache_path /var/cache/nginx/hls levels=1:2
        keys_zone=hls:10m max_size=256m inactive=60m;

    proxy_buffering on;
    proxy_max_temp_file_size 8m;

    upstream origin {
        server origin:3000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://origin;
            proxy_cache hls;
            proxy_cache_valid 200 206 60s;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_age 30s;
            proxy_cache_lock_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://origin;
            proxy_cache hls;
            proxy_cache_valid 200 206 60s;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_age 30s;
            proxy_cache_lock_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 8443 proxy_protocol;
        server_name _;

        set_real_ip_from 0.0.0.0/0;
        real_ip_header proxy_protocol;

        location / {
            proxy_pass http://origin;
            proxy_cache hls;
            proxy_cache_valid 200 206 60s;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_age 30s;
            proxy_cache_lock_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
