global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend https_in
    bind *:443 ssl crt /etc/haproxy/tls/combined.pem alpn h2,http/1.1
    default_backend cache_engine

backend cache_engine
    server engine engine:8443 send-proxy-v2
