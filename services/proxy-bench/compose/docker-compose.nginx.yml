services:
  origin:
    build:
      context: ../origin
    expose:
      - "3000"
    ports:
      - "${ORIGIN_PORT:-3100}:3000"
    environment:
      ORIGIN_LATENCY_MS: "${ORIGIN_LATENCY_MS:-0}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/_health"]
      interval: 2s
      timeout: 2s
      retries: 10

  engine:
    image: nginx:stable
    volumes:
      - ../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../configs/tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ../configs/tls/key.pem:/etc/nginx/tls/key.pem:ro
    ports:
      - "${ENGINE_PORT:-6081}:80"
    depends_on:
      origin:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 512M
