services:
  engine:
    command:
      - "-a"
      - "http=:80,HTTP"
      - "-a"
      - "proxy=:8443,PROXY"
      - "-f"
      - "/etc/varnish/default.vcl"
      - "-s"
      - "malloc,256m"
      - "-p"
      - "thread_pools=2"
      - "-p"
      - "thread_pool_min=50"
      - "-p"
      - "thread_pool_max=200"
