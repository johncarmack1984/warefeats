services:
  engine:
    entrypoint: ["/etc/varnish/tls-entrypoint.sh"]
    command:
      - "-a"
      - "http=:80,HTTP"
      - "-a"
      - "https=:443,TLS"
      - "-f"
      - "/etc/varnish/default.vcl"
      - "-s"
      - "malloc,256m"
      - "-p"
      - "thread_pools=2"
      - "-p"
      - "thread_pool_min=50"
      - "-p"
      - "thread_pool_max=200"
      - "-p"
      - "feature=+http2"
    volumes:
      - ../configs/varnish/default.vcl:/etc/varnish/default.vcl:ro
      - ../configs/varnish/tls-entrypoint.sh:/etc/varnish/tls-entrypoint.sh:ro
      - ../configs/tls/combined.pem:/etc/varnish/combined.pem:ro
    ports:
      - "${ENGINE_PORT:-6081}:80"
      - "${TLS_PORT:-6443}:443"
