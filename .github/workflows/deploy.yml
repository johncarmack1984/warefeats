name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Smoke-test benchmark runner
        run: bun run benchmark:smoke -- --output=/tmp/warefeats-smoke.json

      - name: Build web application
        run: bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: warefeats-${{ github.run_id }}

      - name: Deploy infrastructure
        env:
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: bun run infra:deploy -- --require-approval never --outputs-file ../infra-outputs.json

      - name: Read stack outputs
        id: stack
        run: |
          echo "bucket=$(jq -r '.WarefeatsStack.SiteBucketName' infra-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(jq -r '.WarefeatsStack.DistributionId' infra-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.WarefeatsStack.SiteUrl' infra-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Upload site
        env:
          SITE_BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          aws s3 sync web/dist "s3://${SITE_BUCKET}" --delete --cache-control "public,max-age=3600"
          aws s3 sync web/dist "s3://${SITE_BUCKET}" --exclude "*" --include "*.html" --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"
          aws s3 sync web/dist/data "s3://${SITE_BUCKET}/data" --cache-control "public,max-age=300" --content-type "application/json"

      - name: Publish through CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Report deployment URL
        run: echo "Deployed ${{ steps.stack.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
